[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fleet-telemetry"
version = "1.4.0"
description = "Consumer library for the fleet telemetry API (v1): pose parsing, orientation math, sensor fusion and alerts."
requires-python = ">=3.10"
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
test = ["pytest>=7"]

[tool.setuptools]
packages = ["fleet_telemetry"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]  # import this checkout, not an editable install elsewhere (matters in worktrees)
